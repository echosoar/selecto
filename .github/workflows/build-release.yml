name: Automated Release

on:
  push:
    branches:
      - main
    # Reduce unnecessary triggers when only version files change
    paths-ignore:
      - 'version.txt'
      - 'Selecto/Selecto.xcodeproj/project.pbxproj'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit message
        id: check
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          COMMIT_TITLE=$(git log -1 --pretty=%s)

          if [[ "$COMMIT_MSG" == *"Bump version to"* ]]; then
            echo "This is a version bump commit, skipping build"
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "has_release=false" >> $GITHUB_OUTPUT
          elif [[ "$COMMIT_TITLE" == *"release"* ]] || [[ "$COMMIT_TITLE" == *"Release"* ]] || [[ "$COMMIT_TITLE" == *"RELEASE"* ]]; then
            echo "Commit title contains 'release', proceeding"
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "has_release=true" >> $GITHUB_OUTPUT
            echo "commit_message<<EOF" >> $GITHUB_OUTPUT
            echo "$COMMIT_MSG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "Commit title does not contain 'release', skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "has_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Read current version
        if: steps.check.outputs.skip != 'true'
        id: version
        run: |
          CURRENT_VERSION=$(cat version.txt)
          echo "Current version: $CURRENT_VERSION"
          # Expose the current version as a step output so subsequent steps use this old version
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT



      - name: Create DMG from .github/app.zip
        if: steps.check.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p artifacts
          TMPDIR="./dmg-temp"
          rm -rf "$TMPDIR"
          mkdir -p "$TMPDIR"
          if [ ! -f ".github/app.zip" ]; then
            echo "Error: .github/app.zip not found"
            exit 1
          fi
          unzip -q .github/app.zip -d "$TMPDIR"
          APP=$(find "$TMPDIR" -name "Selecto.app" -type d | head -n 1)
          if [ -z "$APP" ]; then
            echo "Error: Selecto.app not found in .github/app.zip"
            ls -la "$TMPDIR"
            exit 1
          fi
          # Prepare DMG folder
          mkdir -p "$TMPDIR/dmgroot"
          cp -R "$APP" "$TMPDIR/dmgroot/"
          ln -s /Applications "$TMPDIR/dmgroot/Applications" || true
          hdiutil create -volname "Selecto" -srcfolder "$TMPDIR/dmgroot" -ov -format UDZO "./artifacts/Selecto-${VERSION}.dmg"
          rm -rf "$TMPDIR"

      - name: Checkout selecto repository
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: echosoar/selecto
          branch: gh-pages
          token: ${{ secrets.GH_PAT_FOR_PUBLISH }}
          path: selecto-release


      - name: Create or update release in selecto repo
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FOR_PUBLISH }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd selecto-release
          # Use gh CLI if available, fallback to skipping release creation
          if command -v gh > /dev/null 2>&1; then
            if gh release view "v${VERSION}" > /dev/null 2>&1; then
              for asset in dist/*.dmg; do
                gh release upload "v${VERSION}" "$asset" --clobber || true
              done
            else
              gh release create "v${VERSION}" --title "Selecto v${VERSION}" --notes "" dist/*.dmg || true
            fi
            gh release edit "v${VERSION}" --latest || true
          else
            echo "Warning: gh CLI not available; skipping release creation step."
          fi

      - name: Bump version, update project and commit
        if: steps.check.outputs.skip != 'true'
        run: |
          # Read current version (the one used for packaging)
          CURRENT_VERSION=$(cat version.txt)
          echo "Current version: $CURRENT_VERSION"
          IFS='.' read -r -a version_parts <<< "$CURRENT_VERSION"
          MAJOR="${version_parts[0]}"
          MINOR="${version_parts[1]}"
          NEW_MINOR=$((MINOR + 1))
          NEW_VERSION="${MAJOR}.${NEW_MINOR}"
          echo "Bumping to new version: $NEW_VERSION"
          # Update version.txt
          echo "$NEW_VERSION" > version.txt

          # Update Xcode project MARKETING_VERSION and CURRENT_PROJECT_VERSION
          BUILD_NUMBER=$(echo "$NEW_VERSION" | tr -d '.')
          sed -i '' "s/MARKETING_VERSION = [^;]*/MARKETING_VERSION = $NEW_VERSION/g" Selecto/Selecto.xcodeproj/project.pbxproj || true
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*/CURRENT_PROJECT_VERSION = $BUILD_NUMBER/g" Selecto/Selecto.xcodeproj/project.pbxproj || true

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt Selecto/Selecto.xcodeproj/project.pbxproj
          git commit -m "Bump version to ${NEW_VERSION}" || echo "No changes to commit"
          git push
